services:
  jira:
    image: local/jira-example-agent:${JIRA_VERSION:-9.6.0}
    build:
      context: .
      dockerfile: jira/Dockerfile
      args:
        BASE_IMAGE: atlassian/jira-software:${JIRA_VERSION:-9.6.0}-${ATLASSIAN_JAVA_TAG:-jdk11}

  confluence:
    image: local/confluence-example-agent:${CONFLUENCE_VERSION:-7.19.7}
    build:
      context: .
      dockerfile: confluence/Dockerfile
      args:
        BASE_IMAGE: atlassian/confluence-server:${CONFLUENCE_VERSION:-7.19.7}-${ATLASSIAN_JAVA_TAG:-jdk11}
