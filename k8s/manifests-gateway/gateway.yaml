---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: atlassian
  namespace: atlassian
spec:
  gatewayClassName: eg
  listeners:
    # HTTP：只用来 301 跳 HTTPS
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.sl-devops.com"
      allowedRoutes:
        namespaces:
          from: Same
    # HTTPS：Certum 通配证书 *.sl-devops.com（与 compose 环境共用同一张）
    # Secret 手动创建，不入 Git：
    #   kubectl --context orbstack -n atlassian create secret tls sl-devops-wildcard-tls \
    #     --cert=nginx/ssl/sl-devops.com.crt --key=nginx/ssl/sl-devops.com.key
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.sl-devops.com"
      tls:
        mode: Terminate
        certificateRefs:
          # group/kind 写全：API server 会补默认值，不写会让 ArgoCD 永久报 drift
          - group: ""
            kind: Secret
            name: sl-devops-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: atlassian
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: atlassian
      sectionName: http
  hostnames:
    - jira-k8s.sl-devops.com
    - conf-k8s.sl-devops.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
# 注意：jira / confluence 的 HTTPRoute 由各自的 Helm chart 创建
# （k8s/values-*-dc.yaml 的 gateway 段），不要在这里重复定义，
# 否则两个 ArgoCD Application 同时声明同一对象，双方永久 OutOfSync
# 并带 SharedResourceWarning。
