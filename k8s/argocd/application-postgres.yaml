apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlassian-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Arvingrep/atlassian.git
    targetRevision: feat/k8s-argocd-deployment
    path: k8s/manifests
  destination:
    # Cluster name registered in the mac-mini ArgoCD (cluster secret
    # cluster-macbook-orbstack, server https://<macbook-tailnet-ip>:26443)
    name: macbook-orbstack
    namespace: atlassian
  # StatefulSets carry API-server defaults (podManagementPolicy, revisionHistoryLimit,
  # probe thresholds, ...) plus an immutable volumeClaimTemplates block, which ArgoCD
  # reports as permanent drift on an otherwise matching object.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/revisionHistoryLimit
        - /spec/podManagementPolicy
        - /spec/updateStrategy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
