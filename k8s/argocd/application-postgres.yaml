apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlassian-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Arvingrep/atlassian.git
    targetRevision: feat/k8s-argocd-deployment
    path: k8s/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: atlassian
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
