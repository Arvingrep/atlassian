apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlassian-jira
  namespace: argocd
  annotations:
    # Databases and secrets must exist before the app starts.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Upstream Data Center chart
    - repoURL: https://atlassian.github.io/data-center-helm-charts
      chart: jira
      targetRevision: 2.0.15
      helm:
        releaseName: jira
        valueFiles:
          - $values/k8s/values-jira-dc.yaml
          - $values/k8s/values-jira-ghcr.yaml
    # This repository holds the values files
    - repoURL: https://github.com/Arvingrep/atlassian.git
      targetRevision: feat/k8s-argocd-deployment
      ref: values
  destination:
    # Cluster name registered in the mac-mini ArgoCD (cluster secret
    # cluster-macbook-orbstack, server https://<macbook-tailnet-ip>:26443)
    name: macbook-orbstack
    namespace: atlassian
  # The chart renders HTTPRoute backendRefs without group/kind; the API server
  # defaults them to ("" , Service), which ArgoCD otherwise reports as drift.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
