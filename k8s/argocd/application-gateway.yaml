apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlassian-gateway
  namespace: argocd
  annotations:
    # The Gateway must exist before the product charts' HTTPRoutes attach to it.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Arvingrep/atlassian.git
    targetRevision: feat/k8s-argocd-deployment
    path: k8s/manifests-gateway
  destination:
    # Cluster name registered in the mac-mini ArgoCD (cluster secret
    # cluster-macbook-orbstack, server https://<macbook-magicdns>:26443)
    name: macbook-orbstack
    namespace: atlassian
  # NOTE: the TLS Secret referenced by the https listener is created by hand and
  # is NOT in Git. After a cluster rebuild, create it before this app syncs,
  # otherwise the https listener stays Programmed=False (InvalidCertificateRef).
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
