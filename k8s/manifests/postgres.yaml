apiVersion: v1
kind: Namespace
metadata:
  name: atlassian
  labels:
    app.kubernetes.io/part-of: atlassian-dc-test
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: atlassian
type: Opaque
stringData:
  username: postgres
  password: atlassian-migration-only
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: atlassian
data:
  01-databases.sql: |
    CREATE ROLE jira LOGIN PASSWORD 'atlassian-migration-only';
    CREATE ROLE confluence LOGIN PASSWORD 'atlassian-migration-only';
    CREATE DATABASE jira OWNER jira ENCODING 'UTF8' TEMPLATE template0;
    CREATE DATABASE confluence OWNER confluence ENCODING 'UTF8' TEMPLATE template0;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: atlassian
  labels:
    app: postgres
spec:
  # Keep a stable ClusterIP: with a headless Service (clusterIP: None) the DNS
  # name resolves straight to the pod IP, so when the pod is recreated with a new
  # IP the app's JDBC pool keeps dialling a dead address and Jira locks itself
  # with "failed to establish a connection to your database".
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: atlassian
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        # Pin volumeMode explicitly: the API server defaults it to Filesystem, and
        # ArgoCD otherwise reports the StatefulSet as permanently OutOfSync.
        volumeMode: Filesystem
        resources:
          requests:
            storage: 20Gi
