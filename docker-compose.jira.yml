services:
  nginx:
    image: ${NGINX_IMAGE}
    container_name: ${NGINX_CONTAINER}
    depends_on:
      - jira
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./nginx/migration:/etc/nginx/conf.d:ro
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE}
    platform: ${ATLASSIAN_PLATFORM}
    container_name: ${POSTGRES_CONTAINER}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${JIRA_DB}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg92_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d postgres -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  jira:
    image: ${JIRA_BASE_IMAGE}
    platform: ${ATLASSIAN_PLATFORM}
    container_name: ${JIRA_CONTAINER}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      JVM_MINIMUM_MEMORY: ${JIRA_XMS}
      JVM_MAXIMUM_MEMORY: ${JIRA_XMX}
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/${JIRA_DB}
      ATL_JDBC_USER: ${POSTGRES_USER}
      ATL_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      ATL_PROXY_NAME: ${JIRA_DOMAIN}
      ATL_PROXY_PORT: "${HTTP_PORT}"
      ATL_TOMCAT_SCHEME: http
    ports:
      - "${JIRA_PORT}:8080"
    volumes:
      - jira_home:/var/atlassian/application-data/jira
    restart: unless-stopped

volumes:
  pg92_data:
    name: ${POSTGRES_VOLUME}
  jira_home:
    name: ${JIRA_HOME_VOLUME}
