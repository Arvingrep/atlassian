name: Atlassian CI

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".env"
      - "docker-compose*.yml"
      - "images.*.yml"
      - "jira/Dockerfile"
      - "confluence/Dockerfile"
      - "scripts/**"
      - ".github/workflows/atlassian-ci.yml"
  pull_request:
    paths:
      - ".env"
      - "docker-compose*.yml"
      - "images.*.yml"
      - "jira/Dockerfile"
      - "confluence/Dockerfile"
      - "scripts/**"
      - ".github/workflows/atlassian-ci.yml"
  workflow_dispatch:
    inputs:
      jira_version:
        description: Jira Software version
        required: true
        default: "9.6.0"
      confluence_version:
        description: Confluence version
        required: true
        default: "7.19.7"
      java_tag:
        description: Atlassian image Java suffix
        required: true
        default: "jdk11"

permissions:
  contents: read

concurrency:
  group: atlassian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select environment file
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          JIRA_INPUT: ${{ inputs.jira_version }}
          CONFLUENCE_INPUT: ${{ inputs.confluence_version }}
          JAVA_INPUT: ${{ inputs.java_tag }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            cp .env .env.ci
            sed -i \
              -e "s#^\(JIRA_VERSION=\).*#\1${JIRA_INPUT}#" \
              -e "s#^\(JIRA_BASE_IMAGE=atlassian/jira-software:\)[^-]*#\1${JIRA_INPUT}#" \
              -e "s#^\(JIRA_GHCR_IMAGE=ghcr.io/arvingrep/atlassian-jira:\)[^-]*#\1${JIRA_INPUT}#" \
              -e "s#^\(JIRA_LOCAL_IMAGE=local/atlassian-jira:\)[^-]*#\1${JIRA_INPUT}#" \
              -e "s#^\(CONFLUENCE_VERSION=\).*#\1${CONFLUENCE_INPUT}#" \
              -e "s#^\(CONFLUENCE_BASE_IMAGE=atlassian/confluence-server:\)[^-]*#\1${CONFLUENCE_INPUT}#" \
              -e "s#^\(CONFLUENCE_GHCR_IMAGE=ghcr.io/arvingrep/atlassian-confluence:\)[^-]*#\1${CONFLUENCE_INPUT}#" \
              -e "s#^\(CONFLUENCE_LOCAL_IMAGE=local/atlassian-confluence:\)[^-]*#\1${CONFLUENCE_INPUT}#" \
              -e "s#^\(ATLASSIAN_JAVA_TAG=\).*#\1${JAVA_INPUT}#" \
              .env.ci
            echo "ENV_FILE=$GITHUB_WORKSPACE/.env.ci" >> "$GITHUB_ENV"
          else
            echo "ENV_FILE=$GITHUB_WORKSPACE/.env" >> "$GITHUB_ENV"
          fi

      - name: Validate images, Compose and scripts
        run: scripts/check-upgrade.sh
