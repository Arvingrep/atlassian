name: Atlassian upgrade check

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".env.versions"
      - "docker-compose.migration.yml"
      - "docker/postgres/**"
      - "nginx/migration/**"
      - "scripts/check-upgrade.sh"
      - ".github/workflows/atlassian-upgrade-check.yml"
  pull_request:
    paths:
      - ".env.versions"
      - "docker-compose.migration.yml"
      - "docker/postgres/**"
      - "nginx/migration/**"
      - "scripts/check-upgrade.sh"
      - ".github/workflows/atlassian-upgrade-check.yml"
  workflow_dispatch:
    inputs:
      jira_version:
        description: Jira Software version
        required: true
        default: "9.6.0"
      confluence_version:
        description: Confluence version
        required: true
        default: "7.19.7"
      java_tag:
        description: Atlassian image Java suffix
        required: true
        default: "jdk11"

permissions:
  contents: read

concurrency:
  group: atlassian-upgrade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate images and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply workflow-dispatch versions
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          JIRA_VERSION: ${{ inputs.jira_version }}
          CONFLUENCE_VERSION: ${{ inputs.confluence_version }}
          ATLASSIAN_JAVA_TAG: ${{ inputs.java_tag }}
        run: |
          printf 'JIRA_VERSION=%s\nCONFLUENCE_VERSION=%s\nATLASSIAN_JAVA_TAG=%s\n' \
            "$JIRA_VERSION" "$CONFLUENCE_VERSION" "$ATLASSIAN_JAVA_TAG" \
            > .env.ci-versions
          echo "VERSIONS_FILE=$GITHUB_WORKSPACE/.env.ci-versions" >> "$GITHUB_ENV"

      - name: Use repository versions
        if: github.event_name != 'workflow_dispatch'
        run: echo "VERSIONS_FILE=$GITHUB_WORKSPACE/.env.versions" >> "$GITHUB_ENV"

      - name: Validate official image tags and Compose
        run: scripts/check-upgrade.sh

      - name: Start PostgreSQL migration fixture
        run: |
          docker compose --env-file "$VERSIONS_FILE" \
            -f docker-compose.migration.yml up -d postgres

      - name: Verify PostgreSQL fixture
        shell: bash
        run: |
          for attempt in {1..30}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' atlassian-pg92)
            if [[ "$status" == healthy ]]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' atlassian-pg92)" = healthy
          docker compose --env-file "$VERSIONS_FILE" \
            -f docker-compose.migration.yml exec -T postgres \
            psql -U atlassian -d postgres -Atc \
            "select datname from pg_database where datname in ('jira','confluence') order by 1;" \
            | tee /tmp/databases.txt
          diff -u <(printf 'confluence\njira\n') /tmp/databases.txt

      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file "$VERSIONS_FILE" -f docker-compose.migration.yml logs

      - name: Stop fixture
        if: always()
        run: docker compose --env-file "$VERSIONS_FILE" -f docker-compose.migration.yml down -v
