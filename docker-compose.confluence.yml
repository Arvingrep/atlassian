services:
  nginx:
    image: ${NGINX_IMAGE}
    container_name: ${NGINX_CONTAINER}
    depends_on:
      - confluence
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/migration:/etc/nginx/conf.d:ro
      - ${NGINX_TLS_CERT}:/etc/nginx/certs/tls.crt:ro
      - ${NGINX_TLS_KEY}:/etc/nginx/certs/tls.key:ro
    restart: unless-stopped

  postgres:
    image: ${POSTGRES_IMAGE}
    platform: ${ATLASSIAN_PLATFORM}
    container_name: ${POSTGRES_CONTAINER}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${JIRA_DB}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg92_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d postgres -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  confluence:
    image: ${CONFLUENCE_BASE_IMAGE}
    platform: ${ATLASSIAN_PLATFORM}
    container_name: ${CONFLUENCE_CONTAINER}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      JVM_MINIMUM_MEMORY: ${CONFLUENCE_XMS}
      JVM_MAXIMUM_MEMORY: ${CONFLUENCE_XMX}
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/${CONFLUENCE_DB}
      ATL_JDBC_USER: ${POSTGRES_USER}
      ATL_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      ATL_DB_TYPE: postgresql
      ATL_PROXY_NAME: ${CONFLUENCE_DOMAIN}
      ATL_PROXY_PORT: "${ATL_PROXY_PORT}"
      ATL_TOMCAT_SCHEME: ${ATL_TOMCAT_SCHEME}
    ports:
      - "${CONFLUENCE_PORT}:8090"
      - "${CONFLUENCE_SYNCHRONY_PORT}:8091"
    volumes:
      - confluence_home:/var/atlassian/application-data/confluence
    restart: unless-stopped

volumes:
  confluence_home:
    name: ${CONFLUENCE_HOME_VOLUME}
  pg92_data:
    name: ${POSTGRES_VOLUME}
